<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
{{ESTILO_BASE}}
<style>
  .split-foto {
    position: absolute; top: 0; left: 0; right: 0; height: 640px;
    background-image: url('{{FOTO_DATA_URI}}'); background-size: cover; background-position: center;
  }
  .cabecalho--foto {
    position: absolute; top: 0; left: 0; right: 0; padding: 60px 90px;
    color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
  }
  .cabecalho--foto .arraste { opacity: .9; }
  .split-texto {
    position: absolute; top: 640px; left: 0; right: 0; bottom: 0;
    padding: 72px 90px 96px; display: flex; flex-direction: column; gap: 34px;
  }
  .titulo--foto { font-size: 74px; }
  .split-texto .corpo { flex: 1; }
</style>
</head>
<body>
  <div class="split-foto"></div>
  <div class="cabecalho cabecalho--foto">
    <span>{{ARROBA}}</span>
    <span class="arraste">{{INDICADOR_ARRASTE}}</span>
  </div>
  <div class="split-texto">
    <div class="titulo titulo--foto">{{TITULO}}</div>
    <div class="corpo">{{CORPO_HTML}}</div>
    <div class="rodape">
      <span class="linha"></span>
      <span class="contador">{{CONTADOR}}</span>
    </div>
  </div>
</body>
</html>

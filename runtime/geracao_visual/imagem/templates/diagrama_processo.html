<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
{{ESTILO_BASE}}
<style>
  /* centrado no vão quando há poucos passos; encosta no topo se transbordar */
  .conteudo--proc { gap: 40px; }
  .titulo--proc { font-size: 76px; }

  ol.passos { list-style: none; display: flex; flex-direction: column; gap: 0; }
  ol.passos li {
    position: relative; min-height: 92px; padding: 0 0 52px 128px;
    display: flex; align-items: center;
    font-size: 34px; line-height: 1.32;
  }
  ol.passos li:last-child { padding-bottom: 0; }

  /* badge QUADRADO arredondado com ícone (≠ círculo numerado da lista_numerada) */
  ol.passos li::before {
    content: ""; position: absolute; left: 0; top: 2px;
    width: 84px; height: 84px; border-radius: 22px;
    background-color: {{DESTAQUE}};
    background-repeat: no-repeat; background-position: center; background-size: 44px 44px;
  }
  ol.passos li:nth-child(3n+1)::before {
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M21%2015a2%202%200%200%201-2%202H7l-4%204V5a2%202%200%200%201%202-2h14a2%202%200%200%201%202%202z%27%2F%3E%3C%2Fsvg%3E");
  }
  ol.passos li:nth-child(3n+2)::before {
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpolygon%20points%3D%2713%202%203%2014%2012%2014%2011%2022%2021%2010%2012%2010%2013%202%27%2F%3E%3C%2Fsvg%3E");
  }
  ol.passos li:nth-child(3n+3)::before {
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M20%206%209%2017l-5-5%27%2F%3E%3C%2Fsvg%3E");
  }

  /* seta de verdade conectando os passos (≠ linha reta da lista) */
  ol.passos li:not(:last-child)::after {
    content: "\25BC"; position: absolute; left: 0; width: 84px;
    bottom: 8px; text-align: center; line-height: 1;
    font-size: 30px; color: {{DESTAQUE}};
  }
</style>
</head>
<body>
  <div class="quadro">
    <div class="cabecalho">
      <span>{{ARROBA}}</span>
      <span class="arraste">{{INDICADOR_ARRASTE}}</span>
    </div>
    <div class="conteudo conteudo--proc">
      <div class="titulo titulo--proc">{{TITULO}}</div>
      <ol class="passos">{{ITENS_HTML}}</ol>
    </div>
    <div class="rodape">
      <span class="linha"></span>
      <span class="contador">{{CONTADOR}}</span>
    </div>
  </div>
</body>
</html>
